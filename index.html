function Badge({ text, bg = GOLD, color = WHITE, small = false }) {
  return <span style={{ background: bg, color, borderRadius: 999, fontSize: small ? 10 : 11, fontWeight: 700, padding: small ? "1px 8px" : "2px 10px", display: "inline-block", whiteSpace: "nowrap" }}>{text}</span>;
}
function GradePill({ grade }) {
  const c = GC[grade] || {}; return <Badge text={grade} bg={c.bg} color={c.text} small />;
}
function ETag({ id }) {
  const icon = EQUIP_ICONS[id] || "•";
  const label = id.replace(/([A-Z])/g, " $1").replace(/^./, s => s.toUpperCase());
  return <span style={{ background: LIGHT_GOLD, color: ROYAL_BLUE, borderRadius: 999, fontSize: 10, fontWeight: 600, padding: "2px 8px", display: "inline-flex", alignItems: "center", gap: 3 }}>{icon} {label}</span>;
}

function SlotBlock({ slot, isFiltered, onClick }) {
  const { time, label, type, grade, sameNext, note, loc, court, msShare } = slot;
  if (type === "Transit") return (
    <div style={{ background: "#FAFAFA", borderLeft: "3px solid #F3F4F6", borderBottom: "1px solid #F3F4F6", padding: "2px 8px", display: "flex", gap: 6, alignItems: "center" }}>
      <span style={{ fontSize: 8, color: "#D1D5DB" }}>{time}</span>
      <span style={{ fontSize: 8, color: note?.includes("⚠") ? "#F59E0B" : "#D1D5DB" }}>{note}</span>
    </div>
  );
  const faded = isFiltered && type === "Class";
  const s = type === "Class" ? (GC[grade] || {}) : (GC_SLOT[type] || GC_SLOT.Planning);
  const ls = LOC_STYLE[loc] || LOC_STYLE.TBD;
  const cs = COURT_STYLE[court] || COURT_STYLE.TBD;
  return (
    <div onClick={() => type === "Class" && onClick(grade)} style={{ background: faded ? "#F9FAFB" : s.bg, borderLeft: `3px solid ${faded ? "#E5E7EB" : s.border}`, borderBottom: "1px solid #E9EFF7", padding: "7px 8px", cursor: type === "Class" ? "pointer" : "default", opacity: faded ? 0.3 : 1, transition: "all 0.15s" }}>
      <div style={{ fontSize: 9, color: faded ? "#C4C4C4" : GRAY }}>{time}</div>
      {type === "Class" && <>
        <div style={{ fontWeight: 700, fontSize: 12, color: faded ? "#C4C4C4" : s.text }}>{label}</div>
        <div style={{ marginTop: 3, display: "flex", alignItems: "center", gap: 4, flexWrap: "wrap" }}>
          <GradePill grade={grade} />
          {sameNext && !faded && <span style={{ fontSize: 9, color: s.border, fontWeight: 700 }}>↕</span>}
        </div>
        {!faded && (
          <div style={{ marginTop: 4, display: "flex", gap: 3, flexWrap: "wrap" }}>
            <span style={{ fontSize: 9, fontWeight: 700, borderRadius: 4, padding: "1px 5px", background: ls.bg, color: ls.color }}>{loc || "TBD"}</span>
            <span style={{ fontSize: 9, fontWeight: 600, borderRadius: 4, padding: "1px 5px", background: cs.bg, color: cs.color }}>{court === "TBD" ? "? court" : court}</span>
            {msShare && <span style={{ fontSize: 9, fontWeight: 700, borderRadius: 4, padding: "1px 5px", background: "#FEE2E2", color: "#991B1B" }}>⚠ MS</span>}
          </div>
        )}
      </>}
      {type === "Planning"  && <div style={{ fontWeight: 600, fontSize: 11, color: s.text }}>📝 {label}<div style={{ fontSize: 9, color: s.border }}>{note}</div></div>}
      {type === "EOD"       && <div style={{ fontWeight: 600, fontSize: 11, color: s.text }}>📝 Planning<div style={{ fontSize: 9, color: s.border }}>{note}</div></div>}
      {type === "Lunch"     && <div style={{ fontWeight: 700, fontSize: 12, color: s.text }}>🍽 Lunch<div style={{ fontSize: 9, color: s.border }}>{note}</div></div>}
      {type === "LunchDesk" && <div style={{ fontWeight: 700, fontSize: 12, color: s.text }}>🥪 Lunch<div style={{ fontSize: 9, color: s.border }}>{note}</div></div>}
      {type === "Chapel"    && <div style={{ fontWeight: 600, fontSize: 11, color: s.text }}>✝ ES Chapel</div>}
      {type === "Meeting"   && <div style={{ fontWeight: 700, fontSize: 11, color: s.text }}>🗓 {label}<div style={{ fontSize: 9, color: s.border, marginTop: 2, lineHeight: 1.4 }}>{note}</div></div>}
    </div>
  );
}

// ─── PLANNER TAB ─────────────────────────────────────────────────────────────
function PlannerTab({ games, plan, setPlan }) {
  const [monthIdx, setMonthIdx]   = useState(0);
  const [picking, setPicking]     = useState(null);     // { month, week, day, grade }
  const [gameFilter, setGameFilter] = useState("All");
  const [expandedWeek, setExpandedWeek] = useState(0);

  const month = SCHOOL_MONTHS[monthIdx];
  const royalRow = ROYAL_WAY.find(r => r.month === month.label);
  const days = ["Monday","Tuesday","Wednesday","Thursday","Friday"];

  // Get or init plan for a slot
  const getSlot = (w, day, grade) => {
    return plan?.[month.label]?.[w]?.[day]?.[grade] || null;
  };

  // Copy one grade's plan to all other classes of same grade across the whole week
  const copyGradeAcrossDay = (w, sourceDay, grade) => {
    const sourceSlot = getSlot(w, sourceDay, grade);
    if (!sourceSlot) return;
    const days = ["Monday","Tuesday","Wednesday","Thursday","Friday"];
    setPlan(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      if (!next[month.label]) next[month.label] = {};
      if (!next[month.label][w]) next[month.label][w] = {};
      days.forEach(day => {
        if ((DAY_GRADES[day]||[]).includes(grade)) {
          if (!next[month.label][w][day]) next[month.label][w][day] = {};
          next[month.label][w][day][grade] = { ...sourceSlot };
        }
      });
      return next;
    });
  };

  // Get/set warmup for a grade+week
  const getWarmup = (w, grade) => plan?.[month.label]?.[w]?.["_warmup"]?.[grade] || null;
  const setWarmup = (w, grade, value) => {
    setPlan(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      if (!next[month.label]) next[month.label] = {};
      if (!next[month.label][w]) next[month.label][w] = {};
      if (!next[month.label][w]["_warmup"]) next[month.label][w]["_warmup"] = {};
      next[month.label][w]["_warmup"][grade] = value;
      return next;
    });
  };

  // Save a slot
  const setSlot = (w, day, grade, value) => {
    setPlan(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      if (!next[month.label]) next[month.label] = {};
      if (!next[month.label][w]) next[month.label][w] = {};
      if (!next[month.label][w][day]) next[month.label][w][day] = {};
      next[month.label][w][day][grade] = value;
      return next;
    });
  };

  // Clear a slot
  const clearSlot = (w, day, grade) => {
    setPlan(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      if (next?.[month.label]?.[w]?.[day]?.[grade]) {
        delete next[month.label][w][day][grade];
      }
      return next;
    });
  };

  // Copy entire week to next week
  const copyWeekDown = (w) => {
    if (w >= month.weeks - 1) return;
    setPlan(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      if (!next[month.label]) next[month.label] = {};
      const src = next?.[month.label]?.[w] || {};
      next[month.label][w + 1] = JSON.parse(JSON.stringify(src));
      return next;
    });
  };

  // Collect all equip needed for a week
  const weekEquip = (w) => {
    const equip = new Set();
    days.forEach(day => {
      (DAY_GRADES[day] || []).forEach(grade => {
        const slot = getSlot(w, day, grade);
        if (slot?.gameId) {
          const g = games.find(g => g.id === slot.gameId);
          if (g) g.equip.forEach(e => equip.add(e));
        }
      });
    });
    return [...equip];
  };

  // Filtered games for picker
  const pickerGames = picking
    ? games.filter(g => gameFilter === "All" || g.grades.includes(gameFilter) || g.category === gameFilter)
         .filter(g => !picking.grade || g.grades.includes(picking.grade))
    : [];

  const gradeColor = (grade) => GC[grade] || { bg: "#F3F4F6", text: "#374151", border: "#D1D5DB" };

  return (
    <div>
      {/* Month navigator */}
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14 }}>
        <button onClick={() => { setMonthIdx(i => Math.max(0, i-1)); setExpandedWeek(0); }}
          style={{ background: monthIdx === 0 ? "#F3F4F6" : ROYAL_BLUE, color: monthIdx === 0 ? GRAY : WHITE,
            border: "none", borderRadius: 8, padding: "7px 14px", fontWeight: 700, fontSize: 14, cursor: monthIdx === 0 ? "default" : "pointer" }}>‹</button>
        <div style={{ flex: 1, textAlign: "center" }}>
          <div style={{ fontWeight: 900, fontSize: 18, color: ROYAL_BLUE }}>{month.label}</div>
          <div style={{ fontSize: 11, color: GRAY }}>{month.weeks} school weeks · starts {month.start}</div>
        </div>
        <button onClick={() => { setMonthIdx(i => Math.min(SCHOOL_MONTHS.length-1, i+1)); setExpandedWeek(0); }}
          style={{ background: monthIdx === SCHOOL_MONTHS.length-1 ? "#F3F4F6" : ROYAL_BLUE, color: monthIdx === SCHOOL_MONTHS.length-1 ? GRAY : WHITE,
            border: "none", borderRadius: 8, padding: "7px 14px", fontWeight: 700, fontSize: 14, cursor: monthIdx === SCHOOL_MONTHS.length-1 ? "default" : "pointer" }}>›</button>
      </div>

      {/* Royal Way banner for month */}
      {royalRow && royalRow.chapelTheme !== "—" && (
        <div style={{ background: `linear-gradient(135deg, ${ROYAL_BLUE}, #2A5298)`, borderRadius: 10, padding: "10px 14px", marginBottom: 14, display: "flex", gap: 12, alignItems: "center" }}>
          <div style={{ flex: 1 }}>
            <div style={{ color: GOLD, fontWeight: 800, fontSize: 12 }}>👑 {royalRow.chapelTheme} — {royalRow.virtue}</div>
            <div style={{ color: WHITE, fontSize: 11, marginTop: 2, opacity: 0.85 }}>{royalRow.virtueNote}</div>
          </div>
          <div style={{ background: "rgba(201,168,76,0.2)", borderRadius: 8, padding: "6px 10px", textAlign: "center", flexShrink: 0 }}>
            <div style={{ color: GOLD, fontSize: 10, fontWeight: 700 }}>📖 {royalRow.verseRef}</div>
          </div>
        </div>
      )}

      {/* Weeks */}
      {Array.from({ length: month.weeks }, (_, w) => {
        const isOpen = expandedWeek === w;
        const allEquip = weekEquip(w);
        const filledSlots = days.reduce((acc, day) =>
          acc + (DAY_GRADES[day]||[]).filter(g => getSlot(w, day, g)).length, 0);
        const totalSlots = days.reduce((acc, day) => acc + (DAY_GRADES[day]||[]).length, 0);

        return (
          <div key={w} style={{ border: `1px solid ${isOpen ? ROYAL_BLUE : "#E5E7EB"}`, borderRadius: 12, marginBottom: 10, overflow: "hidden" }}>

            {/* Week header */}
            <button onClick={() => setExpandedWeek(isOpen ? -1 : w)}
              style={{ width: "100%", textAlign: "left", border: "none", cursor: "pointer",
                background: isOpen ? LIGHT_BLUE : WHITE, padding: "12px 14px",
                display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div>
                <div style={{ fontWeight: 800, color: ROYAL_BLUE, fontSize: 14 }}>Week {w + 1}</div>
                <div style={{ fontSize: 11, color: GRAY, marginTop: 2 }}>
                  {filledSlots}/{totalSlots} slots planned
                  {allEquip.length > 0 && <span style={{ marginLeft: 8 }}>· Equip: {allEquip.map(e => EQUIP_ICONS[e] || "•").join(" ")}</span>}
                </div>
              </div>
              <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                {w < month.weeks - 1 && (
                  <button onClick={(e) => { e.stopPropagation(); copyWeekDown(w); }}
                    title={`Copy this week's plan to Week ${w+2}`}
                    style={{ background: LIGHT_GOLD, color: "#92400E", border: "none", borderRadius: 6,
                      padding: "4px 10px", fontSize: 11, fontWeight: 700, cursor: "pointer" }}>
                    Copy → Wk {w+2}
                  </button>
                )}
                <span style={{ color: GOLD, fontSize: 18, fontWeight: 700 }}>{isOpen ? "▲" : "▼"}</span>
              </div>
            </button>

            {/* Week grid */}
            {isOpen && (
              <div style={{ padding: "12px 14px", background: WHITE }}>
                {/* Warmup / Devotion per Grade */}
                <div style={{ marginBottom:12 }}>
                  <div style={{ fontSize:11, fontWeight:700, color:ROYAL_BLUE, textTransform:"uppercase", letterSpacing:0.5, marginBottom:8 }}>🙏 Warmup / Devotion (60–90 sec) — per grade this week</div>
                  {["K5","1st","2nd","5th"].map(grade => {
                    const warmup = getWarmup(w, grade);
                    const gc = GC[grade];
                    const cur = CURRICULUM[grade]?.[month.label];
                    const royalHook = cur?.devotion || "";
                    return (
                      <div key={grade} style={{ background:gc.bg, border:`1px solid ${gc.border}`, borderRadius:8, padding:"8px 10px", marginBottom:6 }}>
                        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:8 }}>
                          <div style={{ flex:1 }}>
                            <div style={{ fontSize:10, fontWeight:800, color:gc.text, marginBottom:4 }}>{grade} warmup/devotion</div>
                            <textarea
                              value={warmup?.text || ""}
                              onChange={e => setWarmup(w, grade, { text: e.target.value })}
                              placeholder={royalHook || "Write a 60–90 sec opening talk connecting today's game to the Kingdom Kids theme…"}
                              style={{ width:"100%", fontSize:11, padding:"6px 8px", borderRadius:6, border:`1px solid ${gc.border}`, fontFamily:"inherit", resize:"vertical", minHeight:52, background:"#fff", boxSizing:"border-box", outline:"none" }}
                            />
                          </div>
                        </div>
                        {royalHook && !warmup?.text && (
                          <button onClick={() => setWarmup(w, grade, { text: royalHook })}
                            style={{ marginTop:4, fontSize:10, background:"none", border:`1px solid ${gc.border}`, borderRadius:5, padding:"2px 8px", cursor:"pointer", color:gc.text, fontWeight:600 }}>
                            ↓ Use suggested devotion
                          </button>
                        )}
                      </div>
                    );
                  })}
                </div>

                {/* Curriculum + Devotion strip */}
                {(["K5","1st","2nd","5th"]).map(grade => {
                  const cur = CURRICULUM[grade]?.[month.label];
                  if (!cur) return null;
                  const gc = GC[grade];
                  return (
                    <div key={grade} style={{ background: gc.bg, border: `1px solid ${gc.border}`, borderRadius: 8, padding: "8px 12px", marginBottom: 8 }}>
                      <div style={{ display: "flex", gap: 8, alignItems: "baseline", flexWrap: "wrap" }}>
                        <span style={{ fontSize: 10, fontWeight: 800, color: gc.text, background: WHITE, border: `1px solid ${gc.border}`, borderRadius: 4, padding: "1px 6px" }}>{grade}</span>
                        <span style={{ fontSize: 12, fontWeight: 700, color: gc.text }}>{cur.unit}</span>
                        <span style={{ fontSize: 11, color: GRAY }}>— {cur.skills}</span>
                      </div>
                      <div style={{ marginTop: 5, fontSize: 11, color: ROYAL_BLUE, fontStyle: "italic", display: "flex", gap: 5 }}>
                        <span style={{ color: GOLD, fontWeight: 700, flexShrink: 0 }}>✝</span>
                        <span>{cur.devotion}</span>
                      </div>
                    </div>
                  );
                })}

                {/* Equipment summary */}
                {allEquip.length > 0 && (
                  <div style={{ background: LIGHT_BLUE, borderRadius: 8, padding: "8px 12px", marginBottom: 12, display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
                    <span style={{ fontSize: 11, fontWeight: 700, color: ROYAL_BLUE }}>📦 Week equip:</span>
                    {allEquip.map(e => (
                      <span key={e} style={{ background: WHITE, border: `1px solid #BFDBFE`, borderRadius: 6, padding: "2px 8px", fontSize: 11, color: ROYAL_BLUE }}>
                        {EQUIP_ICONS[e] || "•"} {e}
                      </span>
                    ))}
                  </div>
                )}

                {/* Day columns */}
                <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 4 }}>
                  {days.map(day => (
                    <div key={day} style={{ flex: 1, minWidth: 110 }}>
                      {/* Day header */}
                      <div style={{ background: ROYAL_BLUE, color: WHITE, fontWeight: 800, fontSize: 11,
                        padding: "6px 6px", borderRadius: "8px 8px 0 0", textAlign: "center" }}>{day}</div>
                      <div style={{ border: `1px solid #E5E7EB`, borderTop: "none", borderRadius: "0 0 8px 8px", overflow: "hidden" }}>
                        {(DAY_GRADES[day] || []).map(grade => {
                          const slot = getSlot(w, day, grade);
                          const gc = gradeColor(grade);
                          const slotGame = slot ? games.find(g => g.id === slot.gameId) : null;
                          return (
                            <div key={grade} style={{ borderBottom: `1px solid #F3F4F6`, padding: "6px 6px", background: slot ? gc.bg : "#FAFAFA" }}>
                              {/* Grade label */}
                              <div style={{ fontSize: 9, fontWeight: 800, color: gc.text, marginBottom: 3,
                                background: gc.bg, border: `1px solid ${gc.border}`, borderRadius: 4,
                                display: "inline-block", padding: "1px 5px" }}>{grade}</div>

                              {slot && slotGame ? (
                                <div>
                                  <div style={{ fontSize: 11, fontWeight: 700, color: ROYAL_BLUE, lineHeight: 1.3 }}>{slotGame.name}</div>
                                  {slot.variation && (
                                    <div style={{ fontSize: 9, color: "#92400E", background: LIGHT_GOLD,
                                      borderRadius: 4, padding: "1px 4px", marginTop: 2, lineHeight: 1.4 }}>
                                      📝 {slot.variation}
                                    </div>
                                  )}
                                  {slot.notes && (
                                    <div style={{ fontSize: 9, color: GRAY, marginTop: 2, fontStyle: "italic", lineHeight: 1.3 }}>{slot.notes}</div>
                                  )}
                                  <div style={{ display: "flex", gap: 4, marginTop: 5, flexWrap:"wrap" }}>
                                    <button onClick={() => setPicking({ month: month.label, week: w, day, grade, editing: slot })}
                                      style={{ flex: 1, background: LIGHT_BLUE, color: ROYAL_BLUE, border: "none",
                                        borderRadius: 4, fontSize: 9, fontWeight: 700, padding: "3px 0", cursor: "pointer" }}>Edit</button>
                                    <button onClick={() => clearSlot(w, day, grade)}
                                      style={{ background: "#FEE2E2", color: "#991B1B", border: "none",
                                        borderRadius: 4, fontSize: 9, fontWeight: 700, padding: "3px 6px", cursor: "pointer" }}>✕</button>
                                  </div>
                                  <button onClick={() => { copyGradeAcrossDay(w, day, grade); }}
                                    title={`Copy this ${grade} plan to all ${grade} classes this week`}
                                    style={{ width:"100%", marginTop:4, background:GC[grade]?.border||GOLD, color:"#fff", border:"none",
                                      borderRadius:4, fontSize:9, fontWeight:700, padding:"3px 4px", cursor:"pointer", lineHeight:1.3 }}>
                                    Copy to all {grade} ↔
                                  </button>
                                </div>
                              ) : (
                                <button onClick={() => setPicking({ month: month.label, week: w, day, grade, editing: null })}
                                  style={{ width: "100%", background: "none", border: `1.5px dashed ${gc.border}`,
                                    borderRadius: 6, padding: "8px 4px", cursor: "pointer", color: gc.text,
                                    fontSize: 10, fontWeight: 600, marginTop: 2 }}>+ Add game</button>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        );
      })}

      {/* ── GAME PICKER MODAL ── */}
      {picking && (
        <div style={{ position: "fixed", top: 0, left: 0, right: 0, bottom: 0, background: "rgba(0,0,0,0.5)",
          zIndex: 1000, display: "flex", alignItems: "flex-end", justifyContent: "center" }}
          onClick={() => setPicking(null)}>
          <div onClick={e => e.stopPropagation()}
            style={{ background: WHITE, borderRadius: "16px 16px 0 0", padding: "16px", width: "100%",
              maxWidth: 600, maxHeight: "85vh", display: "flex", flexDirection: "column" }}>

            {/* Picker header */}
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
              <div>
                <div style={{ fontWeight: 800, color: ROYAL_BLUE, fontSize: 15 }}>
                  {picking.day} · {picking.grade}
                </div>
                <div style={{ fontSize: 11, color: GRAY }}>Week {picking.week + 1} · {picking.month}</div>
              </div>
              <button onClick={() => setPicking(null)}
                style={{ background: "#F3F4F6", border: "none", borderRadius: 8, padding: "6px 12px",
                  fontWeight: 700, fontSize: 13, cursor: "pointer", color: GRAY }}>✕</button>
            </div>

            {/* Game picker body — if game already chosen show detail form, else show list */}
            {picking.editing?.gameId ? (
              <SlotEditForm
                slot={picking.editing}
                game={games.find(g => g.id === picking.editing.gameId)}
                onSave={(updated) => { setSlot(picking.week, picking.day, picking.grade, updated); setPicking(null); }}
                onBack={() => setPicking({ ...picking, editing: null })}
              />
            ) : (
              <>
                {/* Filter bar */}
                <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10 }}>
                  {["All","Tag","Dodgeball","Fitness Station","Cooperative"].map(f => (
                    <button key={f} onClick={() => setGameFilter(f)}
                      style={{ padding: "4px 10px", borderRadius: 999, fontSize: 11, fontWeight: 600,
                        border: `1.5px solid ${gameFilter === f ? ROYAL_BLUE : "#E5E7EB"}`,
                        background: gameFilter === f ? ROYAL_BLUE : WHITE,
                        color: gameFilter === f ? WHITE : GRAY, cursor: "pointer" }}>{f}</button>
                  ))}
                </div>

                {/* Royal Way suggestion strip */}
                {royalRow?.games?.length > 0 && (
                  <div style={{ background: LIGHT_GOLD, borderRadius: 8, padding: "7px 10px", marginBottom: 10 }}>
                    <div style={{ fontSize: 10, fontWeight: 700, color: "#92400E", marginBottom: 5 }}>
                      👑 This month's Royal Way games — {royalRow.virtue}
                    </div>
                    <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                      {royalRow.games.map(gName => {
                        const found = games.find(g => g.name === gName);
                        if (!found || (picking.grade && !found.grades.includes(picking.grade))) return null;
                        return (
                          <button key={gName} onClick={() => setPicking({ ...picking, editing: { gameId: found.id, variation: "", notes: "" } })}
                            style={{ background: GOLD, color: ROYAL_BLUE, border: "none", borderRadius: 6,
                              padding: "4px 10px", fontSize: 11, fontWeight: 700, cursor: "pointer" }}>{gName}</button>
                        );
                      })}
                    </div>
                  </div>
                )}

                {/* Game list */}
                <div style={{ overflowY: "auto", flex: 1 }}>
                  {pickerGames.map(g => (
                    <button key={g.id} onClick={() => setPicking({ ...picking, editing: { gameId: g.id, variation: "", notes: "" } })}
                      style={{ width: "100%", textAlign: "left", background: WHITE, border: `1px solid #E5E7EB`,
                        borderRadius: 10, padding: "10px 12px", marginBottom: 7, cursor: "pointer",
                        display: "block" }}>
                      <div style={{ fontWeight: 700, color: ROYAL_BLUE, fontSize: 13 }}>{g.name}</div>
                      <div style={{ display: "flex", gap: 6, marginTop: 4, flexWrap: "wrap" }}>
                        {g.grades.map(gr => <GradePill key={gr} grade={gr} />)}
                        <span style={{ fontSize: 10, color: GRAY }}>⏱ {g.time}</span>
                        <span style={{ fontSize: 10, color: GRAY }}>· {g.category}</span>
                      </div>
                      <div style={{ fontSize: 11, color: GRAY, marginTop: 4 }}>✝ {g.biblical.theme}</div>
                    </button>
                  ))}
                  {pickerGames.length === 0 && (
                    <div style={{ textAlign: "center", color: GRAY, fontSize: 13, marginTop: 20 }}>
                      No games match — try changing the filter
                    </div>
                  )}
                </div>
              </>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

// ─── SLOT EDIT FORM ───────────────────────────────────────────────────────────
function SlotEditForm({ slot, game, onSave, onBack }) {
  const [variation, setVariation] = useState(slot.variation || "");
  const [notes, setNotes]         = useState(slot.notes || "");
  const [devotion, setDevotion]   = useState(slot.devotion || "");

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 12, flex: 1, overflowY: "auto" }}>
      {/* Game summary */}
      <div style={{ background: LIGHT_BLUE, borderRadius: 10, padding: "10px 14px" }}>
        <div style={{ fontWeight: 800, color: ROYAL_BLUE, fontSize: 15 }}>✓ {game.name}</div>
        <div style={{ display: "flex", gap: 6, marginTop: 5, flexWrap: "wrap" }}>
          {game.grades.map(g => <GradePill key={g} grade={g} />)}
          <span style={{ fontSize: 10, color: GRAY }}>⏱ {game.time} · {game.space}</span>
        </div>
        <div style={{ marginTop: 6, fontSize: 11, color: ROYAL_BLUE, fontWeight: 600 }}>✝ {game.biblical.theme}</div>
        <div style={{ marginTop: 2, fontSize: 11, color: GRAY }}>📦 {game.equip.join(", ") || "No equipment"}</div>
      </div>

      {/* Variation picker */}
      {game.variations?.length > 0 && (
        <div>
          <div style={{ fontSize: 11, fontWeight: 700, color: GRAY, textTransform: "uppercase",
            letterSpacing: 0.5, marginBottom: 6 }}>Variation (optional)</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
            <button onClick={() => setVariation("")}
              style={{ textAlign: "left", padding: "7px 10px", borderRadius: 8, border: `1.5px solid ${variation === "" ? ROYAL_BLUE : "#E5E7EB"}`,
                background: variation === "" ? LIGHT_BLUE : WHITE, fontSize: 12, cursor: "pointer",
                color: variation === "" ? ROYAL_BLUE : GRAY, fontWeight: variation === "" ? 700 : 400 }}>
              Standard (no variation)
            </button>
            {game.variations.map((v, i) => {
              const label = v.length > 60 ? v.slice(0, 60) + "…" : v;
              return (
                <button key={i} onClick={() => setVariation(v)}
                  style={{ textAlign: "left", padding: "7px 10px", borderRadius: 8,
                    border: `1.5px solid ${variation === v ? ROYAL_BLUE : "#E5E7EB"}`,
                    background: variation === v ? LIGHT_BLUE : WHITE, fontSize: 12, cursor: "pointer",
                    color: variation === v ? ROYAL_BLUE : "#374151", fontWeight: variation === v ? 700 : 400,
                    lineHeight: 1.4 }}>{label}</button>
              );
            })}
          </div>
        </div>
      )}

      {/* Devotion */}
      <div>
        <div style={{ fontSize: 11, fontWeight: 700, color: ROYAL_BLUE, textTransform: "uppercase",
          letterSpacing: 0.5, marginBottom: 4 }}>✝ Devotion / Kingdom Connection (60–90 sec)</div>
        <div style={{ fontSize: 10, color: GRAY, marginBottom: 6, fontStyle: "italic" }}>
          How does today's game connect to this month's Royal Way theme? Write your opening talk here.
        </div>
        <textarea
          value={devotion}
          onChange={e => setDevotion(e.target.value)}
          placeholder={game.biblical?.connection ? `Suggested: "${game.biblical.connection.slice(0,80)}…"` : "e.g. Today in Armor Up, the spinning hoop is your Shield of Faith — Ephesians 6:16…"}
          style={{ width: "100%", minHeight: 70, padding: "8px 10px", borderRadius: 8,
            border: `1.5px solid #BFDBFE`, fontSize: 12, fontFamily: "inherit",
            resize: "vertical", boxSizing: "border-box", outline: "none",
            background: LIGHT_BLUE }}
        />
        {game.biblical?.verse && (
          <div style={{ marginTop: 4, fontSize: 10, color: ROYAL_BLUE, fontStyle: "italic" }}>
            📖 {game.biblical.verse}
          </div>
        )}
      </div>

      {/* Notes */}
      <div>
        <div style={{ fontSize: 11, fontWeight: 700, color: GRAY, textTransform: "uppercase",
          letterSpacing: 0.5, marginBottom: 6 }}>Notes / How it went</div>
        <textarea
          value={notes}
          onChange={e => setNotes(e.target.value)}
          placeholder="e.g. Tried the silent variation — K5 loved it. Shorten time next week."
          style={{ width: "100%", minHeight: 70, padding: "8px 10px", borderRadius: 8,
            border: `1.5px solid #E5E7EB`, fontSize: 12, fontFamily: "inherit",
            resize: "vertical", boxSizing: "border-box", outline: "none" }}
        />
      </div>

      {/* Actions */}
      <div style={{ display: "flex", gap: 8 }}>
        <button onClick={onBack}
          style={{ flex: 1, background: "#F3F4F6", color: GRAY, border: "none",
            borderRadius: 8, padding: "10px", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>
          ← Change game
        </button>
        <button onClick={() => onSave({ gameId: game.id, variation, notes, devotion })}
          style={{ flex: 2, background: ROYAL_BLUE, color: WHITE, border: "none",
            borderRadius: 8, padding: "10px", fontSize: 13, fontWeight: 800, cursor: "pointer" }}>
          ✓ Save to plan
        </button>
      </div>
    </div>
  );
}


// ─── APP ─────────────────────────────────────────────────────────────────────
function App({ persistentPlan, setPersistentPlan, customGames, setCustomGames }) {
  const [tab, setTab]               = useState("schedule");
  const [activeGrade, setActiveGrade] = useState(null);
  const [gradeFilter, setGradeFilter] = useState("All");
  const [catFilter, setCatFilter]   = useState("All");
  const [showAddGame, setShowAddGame] = useState(false);

  const games    = [...GAMES_DEFAULT, ...(customGames || [])];
  const days     = ["Monday","Tuesday","Wednesday","Thursday","Friday"];
  const grades   = ["All","K5","1st","2nd","5th"];
  const cats     = ["All","Tag","Dodgeball","Fitness Station","Cooperative","Sport Skill"];

  const filtered = games.filter(g =>
    (gradeFilter === "All" || g.grades.includes(gradeFilter)) &&
    (catFilter   === "All" || g.category === catFilter)
  );

  return (
    <div style={{ fontFamily:"'Segoe UI',system-ui,sans-serif", maxWidth:900, margin:"0 auto", background:"#F0F4FA", minHeight:"100vh" }}>

      {/* Add Game Modal */}

        <AddGameModal
          onSave={g => { setCustomGames(prev => [...prev, g]); setShowAddGame(false); }}
          onClose={() => setShowAddGame(false)}
        />

      {/* Header */}
      <div style={{ background:`linear-gradient(135deg,${ROYAL_BLUE},#0F2347)`, padding:"20px 16px 16px", textAlign:"center", borderBottom:`4px solid ${GOLD}` }}>
        <div style={{ fontSize:26 }}>👑🦁</div>
        <div style={{ color:GOLD, fontWeight:900, fontSize:20, letterSpacing:1 }}>BCA ROYALS — PE PLANNER</div>
        <div style={{ color:WHITE, fontSize:12, marginTop:2 }}>Taylor · 2026–2027 · K5 · 1st · 2nd · 5th</div>
        <div style={{ display:"flex", gap:6, justifyContent:"center", marginTop:8, flexWrap:"wrap" }}>
          {["32 classes/wk","Thompson Gym","Thurs lunch only","Biblical integration"].map(l=>(
            <span key={l} style={{ background:"rgba(201,168,76,0.2)", color:GOLD, borderRadius:999, fontSize:10, fontWeight:600, padding:"2px 10px" }}>{l}</span>
          ))}
        </div>
      </div>

      {/* Tabs */}
      <div style={{ display:"flex", background:WHITE, borderBottom:"1px solid #E5E7EB", overflowX:"auto" }}>
        {[
          { id:"schedule",  label:"📅 Schedule"  },
          { id:"games",     label:"🎮 Games"     },
          { id:"equipment", label:"📦 Equipment" },
          { id:"planner",   label:"📋 Planner"   },
          { id:"ckh",       label:"👑 Royal Way" },
        ].map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{ flex:1, padding:"11px 8px", border:"none", cursor:"pointer", fontSize:12, fontWeight:600, whiteSpace:"nowrap", background:tab===t.id?LIGHT_BLUE:WHITE, color:tab===t.id?ROYAL_BLUE:GRAY, borderBottom:tab===t.id?`3px solid ${ROYAL_BLUE}`:"3px solid transparent" }}>{t.label}</button>
        ))}
      </div>

      <div style={{ padding:"16px 12px" }}>

        {/* ── SCHEDULE ── */}
        {tab==="schedule" && <ScheduleTab activeGrade={activeGrade} setActiveGrade={setActiveGrade} />}

        {/* ── GAMES ── */}
        {tab==="games" && (
          <div>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
              <div style={{ fontWeight:800, color:ROYAL_BLUE, fontSize:14 }}>🎮 Game Library <span style={{ fontSize:11, color:GRAY, fontWeight:400 }}>({games.length} games)</span></div>
              <button onClick={()=>setShowAddGame(true)} style={{ background:GOLD, color:ROYAL_BLUE, border:"none", borderRadius:8, padding:"7px 16px", fontWeight:800, fontSize:12, cursor:"pointer" }}>+ Add Game</button>
            </div>
            <div style={{ marginBottom:14 }}>
              <div style={{ fontSize:11, fontWeight:700, color:GRAY, textTransform:"uppercase", letterSpacing:0.5, marginBottom:6 }}>Filter by Grade</div>
              <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginBottom:10 }}>
                {grades.map(g=>{ const active=gradeFilter===g;
                  return <button key={g} onClick={()=>setGradeFilter(g)} style={{ padding:"5px 14px", borderRadius:999, fontSize:12, fontWeight:700, border:`2px solid ${active?ROYAL_BLUE:"#E5E7EB"}`, background:active?ROYAL_BLUE:WHITE, color:active?WHITE:GRAY, cursor:"pointer" }}>{g}</button>;
                })}
              </div>
              <div style={{ fontSize:11, fontWeight:700, color:GRAY, textTransform:"uppercase", letterSpacing:0.5, marginBottom:6 }}>Filter by Category</div>
              <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
                {cats.map(c=>{ const active=catFilter===c;
                  return <button key={c} onClick={()=>setCatFilter(c)} style={{ padding:"5px 14px", borderRadius:999, fontSize:12, fontWeight:600, border:`2px solid ${active?GOLD:"#E5E7EB"}`, background:active?LIGHT_GOLD:WHITE, color:active?"#92400E":GRAY, cursor:"pointer" }}>{c}</button>;
                })}
              </div>
            </div>
            <div style={{ fontSize:12, color:GRAY, marginBottom:12 }}>{filtered.length} game{filtered.length!==1?"s":""} shown</div>
            {filtered.map(g=><GameCard key={g.id} game={g}/>)}
          </div>
        )}

        {/* ── EQUIPMENT ── */}
        {tab==="equipment" && (
          <div>
            <div style={{ background:LIGHT_GOLD, borderRadius:10, padding:"12px 14px", marginBottom:14, borderLeft:`4px solid ${GOLD}` }}>
              <div style={{ fontWeight:700, color:"#92400E", fontSize:13, marginBottom:4 }}>Universal Rule</div>
              <div style={{ fontSize:12, color:"#374151", lineHeight:1.6 }}>
                🔶 <strong>Cones</strong> and 🟦 <strong>Noodles</strong> stay out all day.<br/>
                🔵 <strong>Pit balls</strong> → K5 &nbsp;·&nbsp; 🟠 <strong>Foam balls</strong> → 1st &amp; 2nd &nbsp;·&nbsp; 🏀 <strong>Basketballs</strong> → 5th
              </div>
            </div>
            {days.map(day=><DayEquipCard key={day} day={day} data={dailyEquip[day]}/>)}
          </div>
        )}

        {/* ── PLANNER ── */}
        {tab==="planner" && (
          <PlannerTab
            games={games}
            plan={persistentPlan}
            setPlan={setPersistentPlan}
          />
        )}

        {/* ── ROYAL WAY ── */}
        {tab==="ckh" && <CKHTab />}

      </div>

      <div style={{ padding:"14px 20px", textAlign:"center", borderTop:`1px solid ${LIGHT_BLUE}` }}>
        <div style={{ color:GRAY, fontSize:11 }}>BCA Royals PE · Taylor · 2026–2027 · The Royal Way — Kingdom Kids Integration</div>
      </div>
    </div>
  );
}

function usePersistentState(key, defaultValue) {
  const [state, setState] = useState(() => {
    try {
      const stored = localStorage.getItem(key);
      return stored ? JSON.parse(stored) : defaultValue;
    } catch(e) { return defaultValue; }
  });
  const setPersistent = useCallback((value) => {
    setState(prev => {
      const next = typeof value === "function" ? value(prev) : value;
      try { localStorage.setItem(key, JSON.stringify(next)); } catch(e) {}
      return next;
    });
  }, [key]);
  return [state, setPersistent];
}
function PersistentApp() {
  const [plan, setPlan]               = usePersistentState("bca-pe-plan-v2", {});
  const [customGames, setCustomGames] = usePersistentState("bca-pe-games-v1", []);
  const [lastSaved, setLastSaved]     = useState(null);
  useEffect(() => { setLastSaved(new Date().toLocaleTimeString()); }, [plan, customGames]);
  return (
    <div>
      <App persistentPlan={plan} setPersistentPlan={setPlan} customGames={customGames} setCustomGames={setCustomGames} />
      {lastSaved && (
        <div style={{ position:"fixed", bottom:12, right:12, background:"#1B3A6B", color:"#C9A84C", borderRadius:8, padding:"5px 12px", fontSize:11, fontWeight:700, boxShadow:"0 2px 8px rgba(0,0,0,0.2)", zIndex:9999, opacity:0.9 }}>
          Saved {lastSaved}
        </div>
      )}
    </div>
  );
}
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<PersistentApp />); 
</script>
