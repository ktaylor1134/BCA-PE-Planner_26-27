  how: ["Taggers chase runners and tag them (noodle, shoulder and below).", "Tagged players freeze: feet wide apart, hands in the air — 'stuck in the mud.'", "An untagged teammate can free them by crawling through their legs (girls free girls, boys free boys).", "Tagger wins if everyone is stuck simultaneously.", "Rotate taggers every 3–4 min."],
  biblical: {
    theme: "Being Rescued — Psalm 40:2",
    connection: "Psalm 40:2 says God lifted David out of the 'slimy pit.' When you're stuck — in the mud, in a hard situation, in sin — God sends people to help rescue you. The person crawling through? That's a friend willing to humble themselves to get you out.",
    debrief: "What did you have to do to rescue someone in this game? You had to go LOW. Why might it be hard to humble yourself to help someone? Who in your life has gone low to help you?",
    verse: "Psalm 40:2 — 'He lifted me out of the slimy pit, out of the mud and mire; he set my feet on a rock.'"
  },
  variations: ["Theme as 'quicksand' — whoever was rescued can rejoin but must go very slowly (they're still a little stuck).", "Add a safe zone 'rock' cone — rescuers can carry one player to the rock zone to permanently free them."],
  tips: "Girls/boys only rule keeps it appropriate and avoids any awkwardness. Make this very clear before the game starts."
}, {
  id: "scarvetag",
  name: "Scarf Flag Tag",
  category: "Tag",
  grades: ["K5", "1st", "2nd"],
  space: "Full or Half",
  time: "15–20 min",
  equip: ["scarves"],
  existing: true,
  setup: "Every player tucks a scarf into their waistband as a 'flag.' Open gym. Everyone is both a tagger and a runner at the same time.",
  how: ["Every player has a scarf flag tucked in their waistband.", "Goal: grab other players' scarves while protecting your own.", "If your scarf is pulled, pick it up and tuck it back in — you stay in the game (cooperative version).", "For a competitive round: if your scarf is pulled, you're out. Last scarf standing wins.", "You may not hold your scarf with your hands."],
  biblical: {
    theme: "Self-Control & Protecting What Matters — Proverbs 25:28",
    connection: "Proverbs 25:28 says a person without self-control is like a city with broken-down walls. Your scarf is like your 'wall' — you have to protect it while still being in the game. You can't hide in a corner. You have to learn to move with both offense AND defense.",
    debrief: "Was it hard to go after someone else's scarf while keeping yours safe? What does it look like to protect your character — your 'flag' — while still being engaged in daily life?",
    verse: "Proverbs 25:28 — 'Like a city whose walls are broken through is a person who lacks self-control.'"
  },
  variations: ["Team version: teams protect their scarves while grabbing opponents'. Most scarves at end wins.", "Slow-motion round: everyone moves at 50% speed — easier for K5."],
  tips: "Works beautifully as a warm-up for any lesson since no setup is required — just hand out scarves."
}, {
  id: "scooterag",
  name: "Scooter Flag Tag",
  category: "Tag",
  grades: ["1st", "2nd", "5th"],
  space: "Full",
  time: "20–25 min",
  equip: ["scooters", "noodles", "flags"],
  existing: true,
  setup: "Stick a flag (or scarf) into the handle of each scooter. Students sit on scooters. Flag sticks up from handle like a mast.",
  how: ["Everyone sits on a scooter with a flag in the handle.", "Using hands only to propel (feet stay on scooter), try to grab other players' flags.", "If your flag is grabbed, park your scooter at the sideline and cheer.", "Last flag standing wins the round.", "Restart with new flag placements every 3–4 min."],
  biblical: {
    theme: "Perseverance & Self-Control — Hebrews 12:1",
    connection: "You're in a race but you have to control your vehicle AND protect something at the same time. Hebrews 12:1 says to run with perseverance the race marked out for us — that race has obstacles, other runners, and requires constant focus.",
    debrief: "What made this game hard? Was it the scooter, or protecting the flag, or both? What happens when you focus only on grabbing others' flags and forget your own?",
    verse: "Hebrews 12:1 — 'Let us run with perseverance the race marked out for us.'"
  },
  variations: ["Team version: 2 teams, grab opponents' flags while protecting team flags.", "Cooperative version: work together to deliver ALL flags to a central cone without losing your own."],
  tips: "Safety first: sitting only, fingers away from wheels. Scooter tag is a highlight activity — use as earned or as a unit reward."
},
// DODGEBALL GAMES
{
  id: "jetball",
  name: "Jet Ball",
  category: "Dodgeball",
  grades: ["1st", "2nd", "5th"],
  space: "Full",
  time: "20–30 min",
  equip: ["foamballs", "basketballs"],
  existing: true,
  setup: "2 throwers stand at the free throw line on each end. All runners line up on the baseline opposite them. 2 foam dodgeballs — one per thrower.",
  how: ["Throwers simultaneously throw their balls hard at the backboard. The bounce off the backboard is the 'GO' signal — runners take off.", "Throwers retrieve balls off the backboard and immediately start throwing at runners crossing the court.", "Runners must reach the opposite baseline without being hit (shoulders and below only).", "If a runner is hit, they sit down in place for that round — frozen, but they can still cheer.", "Last 2 runners standing become the new throwers. New round begins."],
  biblical: {
    theme: "Courage Under Pressure — Joshua 1:9",
    connection: "You know the balls are coming. You know it's going to be hard. The moment that ball hits the backboard is your moment — do you flinch, or do you run? Joshua 1:9 says 'Be strong and courageous.' Not because it's safe — because God is with you.",
    debrief: "Was there a moment you wanted to hesitate when the ball hit the backboard? What made you run anyway? What does courage look like when you KNOW something hard is coming?",
    verse: "Joshua 1:9 — 'Be strong and courageous. Do not be afraid; do not be discouraged, for the LORD your God will be with you wherever you go.'"
  },
  variations: ["'Jet Ball with a Buddy' — runners pair up and must cross holding hands. If one is hit, both sit.", "Team Jet Ball — two throwers per team on opposite ends simultaneously."],
  tips: "Throwers should be your strongest/most controlled throwers — pick kids who won't aim at heads. Emphasize: shoulders and below, no headshots. For 1st grade, reduce distance between throwers and runners."
}, {
  id: "fruitdodge",
  name: "Fruit of the Spirit Dodgeball",
  category: "Dodgeball",
  grades: ["1st", "2nd", "5th"],
  space: "Full",
  time: "30–40 min",
  equip: ["foamballs", "cones"],
  setup: "Standard dodgeball halves divided by a center line. Label cards for each round at center. 3–4 foam balls per side.",
  how: ["Standard dodgeball rules — hit below shoulders = out, catch = thrower is out and one teammate returns.", "Each 5-min round has a FRUIT RULE that changes how you play.", "LOVE: If you're out, a teammate can volunteer to take your spot — someone must choose to sacrifice.", "PATIENCE: Count silently to 3 before every throw. Rushing = automatic out.", "KINDNESS: If a teammate drops a ball, you help pick it up before resuming.", "SELF-CONTROL: Underhand throws only. Overhand = your team loses a player.", "JOY: After every out — yours or theirs — everyone says something encouraging before play resumes."],
  biblical: {
    theme: "Fruit of the Spirit — Galatians 5:22-23",
    connection: "The Fruit of the Spirit isn't a feeling — it's a practice. Today you practiced it under pressure, which is exactly when it counts. Anyone can be kind when it's easy.",
    debrief: "Which fruit was hardest to keep during dodgeball? Why is it harder to be patient or kind when you're competing and adrenaline is going?",
    verse: "Galatians 5:22-23 — 'But the fruit of the Spirit is love, joy, peace, patience, kindness...'"
  },
  variations: ["Appoint a 'Fruit Inspector' per round (works great for 5th) — they watch for violations.", "Run all 9 fruits over multiple class sessions as a unit."],
  tips: "The fruit rule IS the lesson — enforce it seriously. Celebrate teams that live the fruit even when losing."
}, {
  id: "jailbreak",
  name: "Jailbreak Dodgeball",
  category: "Dodgeball",
  grades: ["5th"],
  space: "Full",
  time: "25–35 min",
  equip: ["foamballs", "cones"],
  setup: "Split gym in half. Mark a 'prison zone' along the back wall of each side with cones. 3–4 foam balls per side. Teams of 8–10.",
  how: ["Standard dodgeball halves. When a player is hit, they go to PRISON — the zone behind the opposing team's back wall.", "Prisoners are NOT out of the game. From prison, they can still catch and throw balls at active players.", "If a prisoner hits an active player from behind, the prisoner is FREE — they walk back to their team, and the player they hit goes to prison.", "If an active player's throw is caught by a prisoner (not an active player), the prisoner who caught it is freed.", "Basketball hoop bonus: if a player throws a ball into the opposing team's basketball hoop, ALL prisoners on their team are freed at once.", "Game ends when all players on one team are in prison simultaneously."],
  biblical: {
    theme: "Grace & the Prisoner Set Free — Isaiah 61:1 / Luke 4:18",
    connection: "Isaiah 61:1 says Jesus came 'to proclaim freedom for the captives.' In this game, no one stays in prison forever — there's always a way back. That's the Gospel. No one is too far gone. You can still contribute from 'prison.' Your situation doesn't eliminate your purpose.",
    debrief: "Did anyone make a big play from prison? How did it feel to be freed? Has there been a time you felt 'stuck' — in trouble, in a conflict, in a mistake — and someone gave you a way back in?",
    verse: "Isaiah 61:1 — 'He has sent me to proclaim freedom for the captives and release from darkness for the prisoners.'"
  },
  variations: ["Hoop Shot Jailbreak: only way to free ALL prisoners at once is the basketball shot — makes it strategic and exciting.", "'Jailbreak Grace' round: once per game, one player can call 'Grace' and walk into prison to free one teammate, taking their place."],
  tips: "5th graders catch on fast — explain once, then let them play and adjust. The prison-to-active throw is the key mechanic to emphasize. Awareness of ALL directions (front and back) is the strategic skill."
},
// GYMNASTICS / FITNESS STATIONS
{
  id: "royalsgymnastics",
  name: "Royals Gymnastics Circuit",
  category: "Fitness Station",
  grades: ["K5", "1st"],
  space: "Full",
  time: "30–40 min",
  equip: ["rollmats", "balancebeam", "cones", "hoops", "beanbags", "jumpropes"],
  setup: "5–6 stations set up around the gym. Picture cards at each station. Groups of 3–4, rotate every 5–6 min.",
  how: ["STATION 1 — Forward Rolls: Roll mat, forward roll with chin tucked. K5: assisted or log roll. 1st: full forward roll attempt.", "STATION 2 — Balance Beam: Low floor beam or tape line. Walk across forward, then backward, then sideways. Add bean bag on head for challenge.", "STATION 3 — Frog Hops: Jump from hoop to hoop in sequence. Two feet in each hoop, no skipping. Count hops per round.", "STATION 4 — Bear Crawl / Crab Walk Lane: Cone-marked lane. Bear crawl down, crab walk back.", "STATION 5 — Jump Rope Skills: Individual rope work. K5 = jump over stationary rope. 1st = timed jumps.", "STATION 6 — Star Balance: Stand on one foot, arms out like a star. Eyes open, then try eyes closed. Hold for 10 sec — personal challenge only."],
  biblical: {
    theme: "Stewardship of the Body — 1 Corinthians 6:19-20",
    connection: "1 Corinthians 6:19-20 says your body is a temple of the Holy Spirit. Fitness stations aren't about looking a certain way — they're about taking care of what God gave you. Every forward roll, every balance attempt, every jump is an act of stewardship.",
    debrief: "Was there a station that was really hard for you? Did you quit or keep trying? Taking care of our bodies takes the same kind of perseverance it takes to grow in faith.",
    verse: "1 Corinthians 6:19-20 — 'Do you not know that your bodies are temples of the Holy Spirit... Therefore honor God with your bodies.'"
  },
  variations: ["Add a 'Courage Station' card: students write or say one thing they tried today that scared them.", "For advanced 1st graders: cartwheel attempt at Station 1 (with spotter/mat only)."],
  tips: "Roll mats must be checked for slip on gym floor before students use them. Forward rolls: emphasize chin tuck always. Never force a roll. For balance beam, spot K5 students for the first rotation."
},
// EXISTING GAMES WITH BIBLICAL INTEGRATION ADDED
{
  id: "shepherdsheep",
  name: "Shepherd & Sheep",
  category: "Tag",
  grades: ["K5", "1st"],
  space: "Full",
  time: "20–25 min",
  equip: ["cones", "hoops", "noodles"],
  setup: "3–4 Shepherds. 2 Wolves (noodle taggers). Everyone else = Sheep. One hula hoop cluster = 'The Fold' (safe zone).",
  how: ["Sheep wander freely around the gym.", "If a Wolf tags a Sheep, that Sheep sits down (lost).", "Shepherds can rescue sitting Sheep by touching their shoulder and walking them back to the Fold.", "Wolves cannot enter the Fold.", "Optional Lost Sheep round: one sheep is blindfolded and guided back by a Shepherd using voice only ('3 steps left, stop, turn right')."],
  biblical: {
    theme: "The Good Shepherd — Psalm 23 / John 10:11",
    connection: "Jesus calls himself the Good Shepherd — and the Good Shepherd leaves the 99 to find the one. In this game, Shepherds don't just protect — they go OUT to where the lost Sheep are. That's the posture of grace: going toward people who are stuck, not waiting for them to find their way back.",
    debrief: "Did your Shepherd ever give up looking for you? How does it feel to know that no matter how 'lost' you get, God is still looking?",
    verse: "John 10:11 — 'I am the good shepherd. The good shepherd lays down his life for the sheep.'"
  },
  variations: [],
  tips: "The blindfold round unlocks a great trust conversation — use it with 1st grade."
},

// FOUR CORNERS
{
  id: "fourcorners",
  name: "Four Corners",
  category: "Tag",
  grades: ["K5", "1st", "2nd", "5th"],
  space: "Full",
  time: "10–20 min",
  equip: ["cones"],
  setup: "Place 4 cones in a large square — one at each corner. 4 players start at the cones. All other players line up outside the square.",
  how: ["First player in line enters the center of the square and yells 'SCRAMBLE!'", "All 4 corner players MUST immediately leave their cone and run to a different corner — they cannot return to their own cone.", "The player in the center races to steal any empty cone.", "5 people, 4 corners — one person ends up without a cone.", "The player left without a cone goes to the back of the line. The player who just came from the center takes a corner. Next person in line enters the center.", "Repeat — everyone rotates through quickly."],
  biblical: {
    theme: "Courage & Acting Quickly — Joshua 1:9",
    connection: "When God told Joshua to move, he didn't hesitate. 'Scramble!' in this game is your Joshua moment — the moment to move fast and trust your instincts. Hesitation costs you the corner. In life, courage often looks like moving before you feel ready.",
    debrief: "What happened when you hesitated? Did fear of making the wrong choice make you freeze? What's one area of your life where you know God is saying 'scramble' and you're still waiting?",
    verse: "Joshua 1:9 — 'Be strong and courageous. Do not be afraid; do not be discouraged, for the Lord your God will be with you wherever you go.'"
  },
  variations: ["Silent Scramble: the center player holds up a hand signal instead of yelling — tests focus and attention.", "Team Scramble (2nd/5th): 2 teams, 2 corners each — center player tries to steal a cone from the opposing team only.", "Seasonal theme: 'Apple Picking' in fall — cones = apple trees, center player = the picker."],
  tips: "Moves very fast — kids get multiple turns quickly which keeps energy high and complaints low. Perfect as a warm-up or filler game when you have 10 min. Establish the 'must leave your cone' rule clearly or kids will hover."
},
// ISLAND ATTACK → rename: WATCHTOWER
{
  id: "watchtower",
  name: "Watchtower",
  category: "Dodgeball",
  grades: ["K5", "1st", "2nd"],
  space: "Full or Half",
  time: "15–25 min",
  equip: ["hoops", "foamballs"],
  setup: "Scatter 6–8 hula hoops across full court (or 5–6 for half court sideways). Place one foam dodgeball in each hoop. Pick one player per hoop to be a 'Watchman' — they stand on their island (one foot in hoop at all times to throw).",
  how: ["All other players ('travelers') line up on one end line.", "On 'GO,' travelers run across the gym to the other end line while Watchmen try to hit them below the shoulder with their dodgeball.", "A Watchman may leave their hoop ONLY to retrieve a ball — but cannot throw until back on their island with at least one foot inside.", "Travelers hit below the shoulder sit down where they were hit — they are out for that round.", "Last players still standing (equal to the number of islands) become the new Watchmen. Reset and play again."],
  biblical: {
    theme: "Standing Guard — Ezekiel 33:6 / Nehemiah 4:9",
    connection: "In the Bible, watchmen stood on towers or walls to protect the city — they couldn't leave their post to throw a spear. Their job was to guard their ground and call out threats from where they stood. This game is exactly that: you have power and a post, but you must stay accountable to it.",
    debrief: "Was it tempting to run away from your island to chase someone? What happened to your team when a watchman abandoned their post? In your family, school, or team — what does it look like to 'hold your post' even when it's hard?",
    verse: "Nehemiah 4:9 — 'We prayed to our God and posted a guard day and night to meet this threat.'"
  },
  variations: ["Seasonal — 'Apple Orchard': hoops = trees, travelers = worms trying to reach the orchard, watchmen = birds protecting the trees.", "For K5: reduce islands to 4, use softer pit balls, shorten the court.", "Power-up round: one island gets a 'lighthouse' (extra ball) — that watchman can throw twice per run."],
  tips: "The 'one foot in hoop' rule is the whole game — enforce it from the start or travelers will complain. Watchmen retrieving balls creates natural chaos that keeps runners moving. Works great half-court sideways if gym is split."
},
// KNOCKOUT (BASKETBALL)
{
  id: "knockout",
  name: "Knockout",
  category: "Fitness Station",
  grades: ["5th"],
  space: "Half (one basket)",
  time: "15–25 min",
  equip: ["basketballs"],
  setup: "All players line up at the free throw line (or closer for beginners). Two basketballs at the front of the line.",
  how: ["Player 1 shoots. Immediately after, Player 2 shoots.", "Player 1 must make their shot before Player 2 — if Player 2 makes it first, Player 1 is knocked out.", "After shooting, each player follows their own ball and shoots from wherever they rebound (no waiting at the line).", "If Player 1 makes their shot first, they pass the ball to Player 3, who now chases Player 2.", "Players who are knocked out cheer from the sideline.", "Last player standing wins the round."],
  biblical: {
    theme: "Perseverance Under Pressure — Philippians 4:13",
    connection: "There's always someone right behind you in this game — you can't slow down, can't coast. That pressure is real. But so is this: 'I can do all things through Christ who strengthens me.' The pressure doesn't go away in life either. The question is who you're running toward.",
    debrief: "How did it feel when the person behind you was close? Did it make you rush and miss, or focus and make it? When life puts pressure on you, what helps you stay focused instead of panicking?",
    verse: "Philippians 4:13 — 'I can do all things through Christ who gives me strength.'"
  },
  variations: ["Tournament bracket: run multiple rounds, track winners, do a class championship.", "Free throw only: everyone must shoot from the line — tests consistency over athleticism.", "Granny shots allowed: players who miss 3 in a row may shoot underhand — keeps less confident players engaged."],
  tips: "Fast, self-refereeing, kids love it. Establish 'you must attempt a shot before chasing your rebound' or kids skip directly to the board and create a pile-up. Works best with 8–15 players per basket."
},
// GAGA BALL
{
  id: "gagaball",
  name: "Gaga Ball",
  category: "Tag",
  grades: ["1st", "2nd", "5th"],
  space: "Half",
  time: "15–25 min",
  equip: ["pitballs", "cones"],
  setup: "Set up a Gaga pit boundary using cones in a rough octagon or circle (or use the center circle of the gym floor). One foam or pit ball in the center. All players inside the boundary.",
  how: ["One player drops the ball in the center. Everyone chants 'GA — GA — GO!' and the ball is live.", "Players hit the ball with an open hand only — no catching, no throwing, no kicking.", "If the ball touches you at or below the knee, you're out — step outside the boundary.", "Players outside can re-enter only if they catch a ball hit out of bounds before it bounces twice.", "Last player inside wins the round.", "Keep rounds short (2–3 min) so eliminated players cycle back in quickly."],
  biblical: {
    theme: "Humility & Staying Low — Micah 6:8 / Matthew 23:12",
    connection: "The strategy of Gaga Ball is literally to stay low. The moment you stand tall and stop watching, you get hit. Humility in Scripture works the same way — 'whoever exalts himself will be humbled.' Staying low, staying aware, watching out for others — that's wisdom.",
    debrief: "What happened when you stood up straight and stopped watching the ball? What does 'staying humble' look like at school — not in your posture, but in how you treat people and how aware you are of others?",
    verse: "Micah 6:8 — 'What does the Lord require of you? To act justly, to love mercy, and to walk humbly with your God.'"
  },
  variations: ["Multi-ball: add a second ball mid-round for chaos — good for large classes.", "Team Gaga: split pit in half with a line of cones, teams try to eliminate all players on the other side.", "Works well for K5 with a smaller boundary and a lighter pit ball."],
  tips: "If no pit is available, cones in an octagon work fine. The re-entry rule (catching out-of-bounds balls) keeps eliminated players engaged and reduces wait time. Enforce open-hand rule from round one."
},
// ROCK PAPER SCISSORS TAG
{
  id: "rpstag",
  name: "Rock Paper Scissors Tag",
  category: "Tag",
  grades: ["K5", "1st", "2nd"],
  space: "Full or Half",
  time: "10–15 min",
  equip: ["cones"],
  setup: "Pairs of players spread throughout the gym. Optional: assign team colors with pinnies or cone markers.",
  how: ["Partners face each other and count '1, 2, 3' together, then throw Rock, Paper, or Scissors.", "Winner immediately becomes the chaser — loser runs away.", "Chaser tries to tag the runner before they reach a designated safe zone (cone or wall).", "After the chase (tag or safe), partners reset and find a new partner.", "Can also be run as team elimination: teams spread along opposite walls, pairs meet in the middle, losers join the winning team."],
  biblical: {
    theme: "Choosing Wisely — Proverbs 3:13–14",
    connection: "Every round requires a split-second choice, then immediate action. Proverbs says wisdom is more valuable than silver or gold. In this game, the 'wise' choice wins — but even when you lose, you get back up and try again. That's resilience, and that's also wisdom.",
    debrief: "Did you try to 'read' your partner — predict what they'd throw? How do we develop wisdom like that in real life — by watching, listening, and paying attention to others?",
    verse: "Proverbs 3:13 — 'Blessed are those who find wisdom, those who gain understanding.'"
  },
  variations: ["Bean Bag Toss partner game: stand 5–8 feet apart, toss a bean bag back and forth, step back one step after each catch. Last pair connected wins.", "Trio RPS: three players, each throws — two who match become chasers after the odd one out.", "Seasonal: 'Pilgrim vs. Turkey vs. Corn' in November — same mechanics, new hand gestures."],
  tips: "RPS Tag is a perfect 5-minute warm-up or transition filler — zero setup, instant energy. For bean bag toss variation, use the same cones already out and space partners evenly across the gym."
},
// NIGHT AT THE MUSEUM → ROYAL GALLERY
{
  id: "royalgallery",
  name: "Royal Gallery",
  category: "Tag",
  grades: ["K5", "1st"],
  space: "Full",
  time: "10–20 min",
  equip: [],
  setup: "No equipment needed. Choose one player to be the 'Royal Guard.' All other players are 'Statues in the King's Gallery.'",
  how: ["The Royal Guard faces a wall and counts to 10 loudly: '1… 2… 3…' (eyes fully closed or facing wall).", "All Statues move freely around the gym during the count.", "When the Guard yells 'FREEZE — the King is watching!' and turns around, all Statues must instantly freeze.", "The Guard walks among the frozen Statues looking for any movement — breathing and blinking are allowed, everything else is not.", "Any Statue seen moving is out and sits on the sideline.", "Last Statue frozen wins and becomes the new Royal Guard."],
  biblical: {
    theme: "Being Seen by God — Psalm 139:1–3",
    connection: "In this game, the Guard can only see what's in front of them. But God sees everything — always — even when no one else is watching. The Statues in the King's Gallery are always before the King. The best thing about God's gaze? It's not a gaze of judgment — it's a gaze of love and deep knowledge.",
    debrief: "When the guard turned around, did you feel nervous — like you were being watched? Now think about this: God always sees you. Does that feel scary, or does it feel like being known and loved? What's the difference between being watched and being cared for?",
    verse: "Psalm 139:1–2 — 'You have searched me, Lord, and you know me. You know when I sit and when I rise; you perceive my thoughts from afar.'"
  },
  variations: ["Nativity version (Christmas): students freeze in Nativity poses — manger scene, shepherds, wise men. Guard tries to guess what each Statue is depicting.", "Original 'Night at the Museum' framing still works if you prefer it — biblical tie is optional.", "For 2nd grade: add a 'Curator' — a second guard who circles from the other direction."],
  tips: "Zero setup makes this a go-to for back-to-back days when you're moving gyms or forgot to stage equipment. Works beautifully as a calm-down game after a high-energy round. K5 loves the 'freeze and giggle' dynamic."
},
// COLOR SORT
{
  id: "colorsort",
  name: "Color Sort",
  category: "Cooperative",
  grades: ["K5", "1st"],
  space: "Full",
  time: "10–20 min",
  equip: ["pitballs", "hoops"],
  setup: "Scatter pit balls of mixed colors all over the gym floor. Place one hula hoop per color in different corners or zones.",
  how: ["Call out a color — students race to find all balls of that color and place them in the matching hoop.", "Once all balls are sorted, call the next color.", "Cooperative version: everyone works together to sort all colors as fast as possible — beat the clock.", "Competitive version: split into color teams, each team is responsible for finding their color. Most sorted wins."],
  biblical: {
    theme: "Order, Creation & Working Together — Genesis 1 / 1 Corinthians 14:40",
    connection: "God created the world in order — He didn't throw everything together and call it good. He sorted light from dark, water from land, and called each thing by name. When we bring order to chaos together, we reflect something true about how God made the world.",
    debrief: "Was it easy or hard to find your color when everything was mixed up? What does it look like when a team or a class is 'mixed up' — no one knows their job? What happens when everyone knows their role?",
    verse: "1 Corinthians 14:40 — 'Everything should be done in a fitting and orderly way.'"
  },
  variations: ["Apple Picking (Fall): red = apples, green = pears, yellow = bananas — seasonal sorting story.", "Easter Egg Hunt (Spring): assign egg colors to teams, race to fill baskets (hoops).", "Extend for 2nd: students sort by two rules at once — color AND size (small vs. large pit balls) if you have mixed sizes."],
  tips: "Fantastic fine motor + cognitive + aerobic combo for K5. Doubles as a color recognition activity for early K5. Scatter balls far apart so students actually run. Also a great gym reset game — scatter at end of class and sort as cleanup."
},
// THING 1 & THING 2 (DR. SEUSS)
{
  id: "thing1thing2",
  name: "Thing 1 & Thing 2 Cleanup",
  category: "Cooperative",
  grades: ["K5", "1st", "2nd"],
